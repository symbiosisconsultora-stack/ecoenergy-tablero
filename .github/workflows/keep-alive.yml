name: Keep Supabase Alive

# Este workflow hace un ping a Supabase 3 veces por semana para evitar
# que el proyecto free se pause por inactividad (7 días sin actividad
# API dispara la pausa automática).
#
# Corre: Lunes, Miércoles, Viernes a las 12:00 UTC (09:00 en Argentina).
# También se puede correr manualmente desde la pestaña Actions del repo.

on:
  schedule:
    # cron format: minute hour day-of-month month day-of-week
    # UTC. Argentina = UTC-3.
    - cron: '0 12 * * 1,3,5'   # lunes, miércoles, viernes a las 12:00 UTC
  workflow_dispatch:            # permite correrlo manualmente desde la web

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Pinging Supabase to keep the project active..."
          RESPONSE=$(curl --silent --show-error --fail --write-out "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/periodos?select=key&limit=1")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K[0-9]+')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase respondió con HTTP $STATUS (esperado: 200)"
            exit 1
          fi
          echo "✓ Supabase activo. Proyecto no se pausará esta semana."
